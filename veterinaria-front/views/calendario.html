<div class="card">
  <div class="cal-head">
    <div class="left">
      <button id="prevMonth" class="btn btn-outline btn-cal">◀</button>
      <h2 id="calTitle">Calendario</h2>
      <button id="nextMonth" class="btn btn-outline btn-cal">▶</button>
    </div>
    <div class="right">
      <input
        id="calSearch"
        class="input"
        placeholder="Buscar por mascota o tipo..."
      />
    </div>
  </div>

  <div class="cal-grid">
    <div class="cal-weekday">Lun</div>
    <div class="cal-weekday">Mar</div>
    <div class="cal-weekday">Mié</div>
    <div class="cal-weekday">Jue</div>
    <div class="cal-weekday">Vie</div>
    <div class="cal-weekday">Sáb</div>
    <div class="cal-weekday">Dom</div>
    <div id="calDays"></div>
  </div>
</div>

<div id="calSide" class="card" style="margin-top: 12px; display: none"></div>
